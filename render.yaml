# Render Blueprint for the Haqqi backend (free plan). See docs/DEPLOY.md.
# In the Render dashboard: New → Blueprint → pick this repo. Render prompts for the `sync: false` secrets.
services:
  - type: web
    name: haqqi-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    buildFilter:
      paths:
        - backend/**
        - data/law/**
        - render.yaml
    healthCheckPath: /healthz
    envVars:
      # Render sets PORT itself; the Dockerfile's CMD listens on it.
      - key: CORS_ORIGINS
        value: '["https://haqqi-ai.vercel.app"]'
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: K2_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Law search embeddings: BGE-M3 on Cloudflare Workers AI (free tier, flag 15)
      - key: EMBEDDER
        value: cloudflare
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
