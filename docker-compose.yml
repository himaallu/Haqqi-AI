services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: haqqi
      POSTGRES_PASSWORD: haqqi
      POSTGRES_DB: haqqi
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haqqi -d haqqi"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    image: haqqi-backend:dev
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://haqqi:haqqi@db:5432/haqqi
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    image: haqqi-frontend:dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db-data:
